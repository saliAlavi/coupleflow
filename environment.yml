# Environment the paper was run with (conda env "nips" on OSC Ascend; CUDA 12.8).
#   conda env create -f environment.yml && conda activate coupleflow && pip install -e .
name: coupleflow
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.10.0
      - numpy==2.4.6
      - scipy==1.16.2
      - omegaconf==2.3.0
      - matplotlib==3.10.7
      - pandas==2.3.3
      - soundfile==0.13.1
      - mne==1.10.2
      - pytest==9.0.2
